[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-risk-volatility-var"
version = "1.0.0"
description = "Realised-volatility forecasting and VaR backtesting: a model comparison, seven VaR routes and a Basel traffic light"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: takes more than a few seconds (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# The scripts are runnable from a fresh clone with no install step, which means they
# have to put `src/` on the path before they can import the package. Every first-party
# import in them is therefore necessarily below a statement, so E402 is the rule
# fighting the bootstrap rather than a real defect. Kept here, once, instead of as
# three `# noqa` comments that a reordering autofix can silently split apart.
"scripts/*.py" = ["E402"]
